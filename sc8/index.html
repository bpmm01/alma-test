<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC8 Daily Record</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d1d1b">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --line:#d9d8d2; --bad:#b3261e; --badbg:#fbe9e7; --head:#efeee8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ecebe6; --muted:#9a9a93; --line:#34342f; --bad:#ff8a80; --badbg:#3a1f1d; --head:#22221f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width:820px; margin:0 auto; padding:16px; }
  header h1 { font-size:20px; margin:0 0 4px; }
  header p { margin:0; color:var(--muted); }
  section { margin-top:22px; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 6px; }
  .wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { background:var(--head); font-weight:600; }
  td.num { font-variant-numeric:tabular-nums; }
  table.wrapcells td { white-space:normal; }
  tr.flag td { background:var(--badbg); color:var(--bad); }
  .note { margin-top:22px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; }
  .err { color:var(--bad); }
  footer { margin-top:28px; color:var(--muted); font-size:12px; }
  @media print { body { background:#fff; color:#000; } tr.flag td { background:#eee; color:#000; font-weight:600; } }
</style>
</head>
<body>
<main id="out"><p>Loading record…</p></main>
<script>
const LABELS = {
  DEL: "Food deliveries", FRG: "Fridge / freezer temperatures",
  CCR: "Cooking / cooling / reheating", HOT: "Hot holding", ACT: "Corrective actions"
};
const HEADS = {
  DEL: ["Time","Supplier","Item","Temp °C","OK","Initials"],
  FRG: ["Unit","AM °C","PM °C","Initials"],
  CCR: ["Time","Item","Type","Temp °C","Initials"],
  HOT: ["Time","Item","Temp °C","Initials"],
  ACT: ["Ref","Issue","Action taken","Initials"]
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function inflate(b64url) {
  const b64 = b64url.replace(/-/g,"+").replace(/_/g,"/");
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream("deflate"));
  return await new Response(stream).text();
}

function flagRow(sec, cells) {
  const t = parseFloat(cells[sec === "DEL" ? 3 : sec === "HOT" ? 2 : 3]);
  if (sec === "DEL") return cells[4] === "N";
  if (sec === "FRG") return [1,2].some(i => { const v = parseFloat(cells[i]); return v > 5 && v < 50; });
  if (sec === "CCR") return (cells[2] === "cook" || cells[2] === "reheat") && t < 75;
  if (sec === "HOT") return t < 63;
  return false;
}

function niceDate(iso) {
  const d = new Date(iso + "T12:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("en-IE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

function render(text) {
  const lines = text.split("\n");
  const [tag, ver, site, date, by, part] = lines[0].split("|");
  if (tag !== "SC8") throw new Error("Not an SC8 record");
  const v2 = ver === "v2";
  let signed;
  if (v2) {
    const who = (by || "").replace("By:", "").trim();
    if (who && who !== "-") {
      const [ini, time] = who.split(" ");
      signed = `Signed off by ${esc(ini)}${time ? " at " + esc(time) : ""}`;
    } else signed = `<span class="err">Not signed off</span>`;
  } else signed = esc((by || "").replace("By:", "Completed by "));
  const [pi, pn] = (part || "1/1").split("/");
  const partText = v2 && pn && pn !== "1" ? ` · <strong>code ${esc(pi)} of ${esc(pn)}</strong>` : "";
  let html = `<header><h1>${esc(site)}</h1><p>SC8 all-in-one daily record · ${esc(niceDate(date))}</p><p>${signed}${partText}</p></header>`;
  let sec = null, rows = [], check = "";
  const flush = () => {
    if (!sec || !HEADS[sec] || !rows.length) return;
    html += `<section><h2>${LABELS[sec]}</h2><div class="wrap"><table${sec === "ACT" ? ' class="wrapcells"' : ""}><thead><tr>${HEADS[sec].map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>`;
    for (const r of rows) {
      const c = r.split(",");
      let flag;
      if (v2) { flag = c[c.length - 1] === "!"; if (flag) c.pop(); }
      else flag = flagRow(sec, c);
      html += `<tr${flag ? ' class="flag"' : ""}>${c.map(v=>`<td${/^-?[\d.]+$/.test(v)?' class="num"':''}>${esc(v)}</td>`).join("")}</tr>`;
    }
    html += `</tbody></table></div></section>`;
  };
  for (const line of lines.slice(1)) {
    if (line.startsWith("#")) {
      flush(); rows = [];
      const t = line.slice(1, 4);
      if (t === "CHK") { check = line.slice(5); sec = null; } else sec = t;
    } else if (line.trim()) rows.push(line);
  }
  flush();
  if (check) html += `<div class="note"><strong>Verification:</strong> ${esc(check)}</div>`;
  if (v2 && pn && pn !== "1") {
    html += `<div class="note">This is code ${esc(pi)} of ${esc(pn)} for this day. Each code holds part of the record - scan the others to see the rest.</div>`;
  }
  html += v2
    ? `<footer>Decoded on this device from the QR code. Highlighted rows were outside the temperature limits set in ALMA; what was done about them is under Corrective actions.</footer>`
    : `<footer>Decoded on this device from the QR code. Highlighted rows are outside limits: delivery rejected, chill above 5 °C, cook/reheat below 75 °C, hot hold below 63 °C.</footer>`;
  document.getElementById("out").innerHTML = html;
  window.scrollTo(0, 0);
}

async function load() {
  const out = document.getElementById("out");
  const data = location.hash.slice(1);
  if (!data) { out.innerHTML = `<p>No record in this link. Scan an SC8 QR code to view a record.</p><p>This viewer is saved on this device and works offline.</p>`; return; }
  try { render(await inflate(data)); }
  catch (e) { out.innerHTML = `<p class="err">Could not read this record: ${esc(e.message)}</p>`; }
}
load();
// Scanning another code while this page is open only changes the part after '#'.
window.addEventListener("hashchange", load);
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
